      body {
        font-family: var(--font-family);
      }
      
      .logo-container > img {
        filter: drop-shadow(0 0 2rem rgba(255, 255, 255, 0.15));
      }
      
      body.theme-dark {
        background: #0f172a; /* Fallback */
        background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      }
      body.theme-bw {
        background-color: #0a0a0a;
      }
      body.theme-br {
        background: #0a0a0a;
        background: radial-gradient(circle at top right, #3f1212 0%, #0a0a0a 60%);
      }
      body.theme-bb {
        background: #050a1a;
        background: radial-gradient(circle at top right, #1e3a8a 0%, #050a1a 60%);
      }
      body.theme-by {
        background: #1a1605;
        background: radial-gradient(circle at top right, #713f12 0%, #1a1605 60%);
      }
      
      .theme-dark .bg-card, .theme-dark .bg-sidebar,
      .theme-bw .bg-card, .theme-bw .bg-sidebar,
      .theme-br .bg-card, .theme-br .bg-sidebar,
      .theme-bb .bg-card, .theme-bb .bg-sidebar,
      .theme-by .bg-card, .theme-by .bg-sidebar {
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }

      .theme-white .schedule-table th, .theme-white .schedule-table td,
      .theme-mint .schedule-table th, .theme-mint .schedule-table td,
      .theme-navy .schedule-table th, .theme-navy .schedule-table td,
      .theme-rose .schedule-table th, .theme-rose .schedule-table td,
      .theme-orange .schedule-table th, .theme-orange .schedule-table td {
        color: #111827;
      }
      .theme-white .schedule-thead, .theme-mint .schedule-thead {
        background-color: var(--color-bg-secondary);
      }
      
      @keyframes pulse-red-border {
        0%, 100% { box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.0); }
        50% { box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.9); }
      }
      .range-start-pulse {
        animation: pulse-red-border 1.5s infinite;
        border-radius: 0.5rem;
      }
       @keyframes pulse-red-dot {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.25); opacity: .75; }
      }
       @keyframes pulse-attention {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
      }
      .animate-pulse-attention {
        animation: pulse-attention 0.8s 2 ease-in-out;
      }
      @keyframes top-pulse-anim {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.1); opacity: 0.8; }
      }
      .animate-top-pulse {
          animation: top-pulse-anim 1s infinite ease-in-out;
      }
      @keyframes gradient-text-anim {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      .animate-gradient-text {
        background: linear-gradient(90deg, #ff00e5, #3b82f6, #facc15, #ff00e5);
        background-size: 200% 200%;
        color: transparent;
        -webkit-background-clip: text;
        background-clip: text;
        animation: gradient-text-anim 4s ease infinite;
      }

      .schedule-table tbody tr {
        transition: transform 300ms ease-in-out, opacity 300ms ease-in-out;
      }
      .schedule-table tbody td, .schedule-table thead th {
        position: relative;
      }
      
      @keyframes fadeOut {
        from { opacity: 1; transform: scale(1); }
        to { opacity: 0; transform: scale(0.9); }
      }
      .is-deleting {
        animation: fadeOut 0.5s ease-out forwards;
      }

      /* --- SCHEDULE HOVER HIGHLIGHT --- */
      .schedule-table {
        --highlight-color: color-mix(in srgb, var(--color-accent) 70%, transparent);
      }
      
      .schedule-highlight-row-hover > td,
      .schedule-highlight-row-hover > th,
      .schedule-highlight-col-hover {
          background-color: color-mix(in srgb, var(--color-accent) 20%, transparent);
          transition: background-color 0.1s ease-in-out;
      }
      .schedule-highlight-row-hover > .schedule-highlight-col-hover {
          background-color: color-mix(in srgb, var(--color-accent) 30%, transparent);
          box-shadow: inset 0 0 10px color-mix(in srgb, var(--color-accent) 15%, transparent);
      }
      
      .schedule-table td::after, .schedule-table th::after {
        content: '';
        position: absolute;
        inset: -1px;
        border: 1px solid transparent;
        pointer-events: none;
        transition: border-color 0.1s ease-in-out;
        z-index: 1;
      }
      
      .schedule-highlight-row-hover > td::after,
      .schedule-highlight-row-hover > th::after {
        border-top-color: var(--highlight-color);
        border-bottom-color: var(--highlight-color);
      }

      .schedule-highlight-row-hover > td:first-of-type::after,
      .schedule-highlight-row-hover > th:first-of-type::after {
        border-left-color: var(--highlight-color);
      }

      .schedule-highlight-row-hover > td:last-of-type::after {
        border-right-color: var(--highlight-color);
      }
      
      .schedule-highlight-col-hover::after {
        border-left-color: var(--highlight-color);
        border-right-color: var(--highlight-color);
      }
      
      .schedule-highlight-row-hover > .schedule-highlight-col-hover::after {
        z-index: 2;
        border-color: var(--highlight-color);
      }
      
      .schedule-day-highlight-problem {
        background-color: color-mix(in srgb, #ef4444 20%, transparent);
      }

      /* Glowing Weekend Highlight */
      @keyframes weekend-glow-pulse {
        0%, 100% {
          box-shadow: inset 0 0 2px 0px color-mix(in srgb, var(--color-accent) 50%, transparent);
        }
        50% {
          box-shadow: inset 0 0 5px 1px color-mix(in srgb, var(--color-accent) 70%, transparent);
        }
      }
      .schedule-weekend-glow {
        animation: weekend-glow-pulse 2.5s infinite ease-in-out;
      }

      /* New Category connector lines */
      .category-children-container {
        position: relative;
        padding-left: 28px; /* 12px for line + 16px spacing */
      }
      .category-children-container::before {
        content: '';
        position: absolute;
        left: 12px;
        top: 0;
        bottom: 0;
        width: 1px;
        background-color: var(--color-border);
      }
      .category-child-item {
        position: relative;
      }
      .category-child-item::before {
        content: '';
        position: absolute;
        left: -16px; /* Connect to the vertical line */
        top: 50%;
        width: 16px;
        height: 1px;
        background-color: var(--color-border);
      }
      .category-children-container > .category-child-item:last-child::before {
        /* Optional: if you want the vertical line to stop at the last child */
        /* height: 50%; top: 0; */
      }

      /* New Themes Button Hover Effect */
      .theme-bw .bg-accent, .theme-br .bg-accent, .theme-bb .bg-accent, .theme-by .bg-accent {
        transition: transform 0.2s ease-in-out;
      }
      .theme-bw .bg-accent:hover:not(:disabled),
      .theme-br .bg-accent:hover:not(:disabled),
      .theme-bb .bg-accent:hover:not(:disabled),
      .theme-by .bg-accent:hover:not(:disabled) {
        transform: scale(1.05);
      }

      /* Vibrant Theme Additions */
      @keyframes vibrant-gradient {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      body.theme-vibrant-dark {
        background: linear-gradient(-45deg, #0d0221, #240b36, #0d0221, #3c1053) !important;
        background-size: 400% 400% !important;
        animation: vibrant-gradient 15s ease infinite !important;
      }
      
      .theme-vibrant-dark h1, .theme-vibrant-dark h2, .theme-vibrant-dark h3, .theme-vibrant-dark .text-header {
        text-shadow: 0 0 5px var(--color-accent), 0 0 8px var(--color-accent);
      }

      .theme-vibrant-dark .bg-card {
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        box-shadow: 0 0 15px rgba(255, 0, 229, 0.2), 0 0 30px rgba(255, 0, 229, 0.1);
        border: 1px solid var(--color-border);
      }

      .theme-vibrant-dark .bg-accent {
        box-shadow: 0 0 5px var(--color-accent), 0 0 10px var(--color-accent);
        transition: all 0.3s ease-in-out;
      }
      .theme-vibrant-dark .bg-accent:hover {
        box-shadow: 0 0 10px var(--color-accent-hover), 0 0 20px var(--color-accent-hover);
        transform: scale(1.05);
      }

      /* Glassmorphism UI */
      .glass-ui-enabled .bg-card, 
      .glass-ui-enabled .bg-sidebar,
      .glass-ui-enabled button:not(.bg-accent):not(.bg-red-600):not(.bg-green-600):not([class*="-500"]) {
        background: rgba(255, 255, 255, 0.1) !important;
        backdrop-filter: blur(12px) !important;
        -webkit-backdrop-filter: blur(12px) !important;
        border: 1px solid rgba(255, 255, 255, 0.2) !important;
      }
      .glass-ui-enabled button[class*="bg-"][class*="-500"],
      .glass-ui-enabled .bg-accent {
        border: 1px solid color-mix(in srgb, var(--color-accent) 60%, transparent) !important;
        box-shadow: 0 0 5px color-mix(in srgb, var(--color-accent) 30%, transparent);
      }
      .glass-ui-enabled .bg-secondary {
        background: rgba(255, 255, 255, 0.05) !important;
      }
       .glass-ui-enabled .text-header,
       .glass-ui-enabled .text-primary-text,
       .glass-ui-enabled .text-secondary-text,
       .glass-ui-enabled h1,
       .glass-ui-enabled h2,
       .glass-ui-enabled h3,
       .glass-ui-enabled p,
       .glass-ui-enabled span,
       .glass-ui-enabled label,
       .glass-ui-enabled button {
         text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
       }
      
      /* New Themes Styling */
      body.theme-military {
        background-color: #3d402b;
        background-image:
          linear-gradient(45deg, #4b5320 25%, transparent 25%), 
          linear-gradient(-45deg, #4b5320 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #4b5320 75%),
          linear-gradient(-45deg, transparent 75%, #4b5320 75%);
        background-size: 20px 20px;
        background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      }
      @keyframes matrix-fall {
        0% { background-position: 0% 0%; }
        100% { background-position: 0% 100%; }
      }
      @keyframes matrix-glitch {
        0%, 100% { text-shadow: 0 0 3px var(--color-accent), -1px -1px 0 red, 1px 1px 0 cyan; }
        50% { text-shadow: 0 0 3px var(--color-accent), 1px 1px 0 red, -1px -1px 0 cyan; }
      }
      @keyframes matrix-fly {
        0% { transform: translate(0, 0) rotate(0deg); }
        20% { transform: translate(-3px, 4px) rotate(-1deg); }
        40% { transform: translate(4px, -3px) rotate(1deg); }
        60% { transform: translate(1px, 1px) rotate(0deg); }
        80% { transform: translate(-3px, -4px) rotate(0.5deg); }
        100% { transform: translate(0, 0) rotate(0deg); }
      }
      body.theme-matrica, .theme-matrica {
        font-family: 'Courier New', Courier, monospace !important;
      }
      body.theme-matrica {

  <body class="bg-primary">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <div id="spotlight"></div>
    <script>
        const spotlight = document.getElementById('spotlight');
        if (spotlight) {
            let mouseX = 0, mouseY = 0;
            let spotlightX = 0, spotlightY = 0;
            const speed = 0.1;

            document.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            function animate() {
                if (document.body.classList.contains('theme-spotlight')) {
                    const dx = mouseX - spotlightX;
                    const dy = mouseY - spotlightY;
                    spotlightX += dx * speed;
                    spotlightY += dy * speed;
                    spotlight.style.left = spotlightX + 'px';
                    spotlight.style.top = spotlightY + 'px';
                }
                requestAnimationFrame(animate);
            }
            animate();
        }
    </script>
