<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Система Обліку Нарядів</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --base-font-size: 13px;
        --user-text-primary-override: unset;
      }
      html {
        font-size: var(--base-font-size);
      }
      :root, .theme-dark {
        --color-bg-primary: #0f172a; /* slate-900 */
        --color-bg-secondary: #1e293b; /* slate-800 */
        --color-sidebar: rgba(15, 23, 42, 0.8); /* slate-900 with opacity */
        --color-card: rgba(30, 41, 59, 0.5); /* slate-800 with opacity */
        --color-accent: #818cf8; /* indigo-400 */
        --color-accent-hover: #a78bfa; /* violet-400 */
        --color-text-header: #f8fafc; /* slate-50 */
        --color-text-primary: var(--user-text-primary-override, #cbd5e1); /* slate-300 */
        --color-text-secondary: #94a3b8; /* slate-400 */
        --color-border: #334155; /* slate-700 */
        --color-weekend-highlight-bg: #1a2436;
        --color-day-off-bg: #1e293b;

        --color-duty-onduty-bg: #e0e0e0; --color-duty-onduty-text: #000000;
        --color-duty-sick-bg: #facc15; --color-duty-sick-text: #1f2937;
        --color-duty-trip-bg: #3b82f6; --color-duty-trip-text: #ffffff;
        --color-duty-hospital-bg: #ef4444; --color-duty-hospital-text: #ffffff;
        --color-duty-leave-bg: #a855f7; --color-duty-leave-text: #ffffff;
        --color-duty-other-bg: #64748b; --color-duty-other-text: #ffffff;
      }
      .theme-white {
        --color-bg-primary: #ffffff;
        --color-bg-secondary: #f9fafb;
        --color-sidebar: #1f2937;
        --color-card: #ffffff;
        --color-accent: #06b6d4;
        --color-accent-hover: #0891b2;
        --color-text-header: #111827;
        --color-text-primary: var(--user-text-primary-override, #1f2937);
        --color-text-secondary: #6b7280;
        --color-border: #e5e7eb;
        --color-weekend-highlight-bg: #f3f4f6;
        --color-day-off-bg: #e5e7eb;
        
        --color-duty-onduty-bg: #111827; --color-duty-onduty-text: #ffffff;
        --color-duty-sick-bg: #fef08a; --color-duty-sick-text: #000000;
        --color-duty-trip-bg: #bfdbfe; --color-duty-trip-text: #000000;
        --color-duty-hospital-bg: #fecaca; --color-duty-hospital-text: #000000;
        --color-duty-leave-bg: #e9d5ff; --color-duty-leave-text: #000000;
        --color-duty-other-bg: #e2e8f0; --color-duty-other-text: #000000;
      }

      /* 1. OCEAN */
      .theme-ocean {
        --color-bg-primary: #0f172a;
        --color-bg-secondary: #1e293b;
        --color-sidebar: rgba(15, 23, 42, 0.9);
        --color-card: rgba(30, 41, 59, 0.6);
        --color-accent: #38bdf8;
        --color-accent-hover: #0ea5e9;
        --color-text-header: #f0f9ff;
        --color-text-primary: #e0f2fe;
        --color-text-secondary: #94a3b8;
        --color-border: #334155;
        background: linear-gradient(to bottom, #0c4a6e, #0f172a);
        background-attachment: fixed;
      }
      .theme-ocean::before {
        content: ' ';
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: 
          radial-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
          radial-gradient(rgba(255,255,255,0.1) 1px, transparent 1px);
        background-size: 50px 50px, 40px 40px;
        background-position: 0 0, 20px 20px;
        animation: floatUp 20s linear infinite;
        pointer-events: none;
        z-index: -1;
      }
      @keyframes floatUp {
        from { background-position: 0 100vh, 20px 120vh; }
        to { background-position: 0 -100vh, 20px -80vh; }
      }

      /* 2. WOOD */
      .theme-wood {
        --color-bg-primary: #2e2418; /* Dark wood */
        --color-bg-secondary: #3e3021;
        --color-sidebar: #261e14;
        --color-card: #463625;
        --color-accent: #65a30d; /* Leaf green */
        --color-accent-hover: #4d7c0f;
        --color-text-header: #ecfccb;
        --color-text-primary: #d6d3d1;
        --color-text-secondary: #a8a29e;
        --color-border: #574633;
        background: #2e2418;
      }
      .theme-wood::before {
        content: '🍂 🍃 🍂';
        position: fixed;
        top: -10%;
        left: 0;
        width: 100%;
        height: 100%;
        font-size: 24px;
        text-shadow: 10vw 20vh 0 rgba(0,0,0,0.2), 30vw 50vh 0 rgba(0,0,0,0.2), 70vw 10vh 0 rgba(0,0,0,0.2), 90vw 60vh 0 rgba(0,0,0,0.2);
        animation: fallingLeaves 15s linear infinite;
        pointer-events: none;
        z-index: -1;
        opacity: 0.3;
      }
      @keyframes fallingLeaves {
        0% { transform: translateY(-10vh) rotate(0deg); }
        100% { transform: translateY(110vh) rotate(360deg); }
      }

      /* 3. CANDY */
      .theme-candy {
        --color-bg-primary: #fdf2f8; /* Pinkish white */
        --color-bg-secondary: #fbcfe8; /* Pink 200 */
        --color-sidebar: #f9a8d4; /* Pink 300 */
        --color-card: #fce7f3;
        --color-accent: #db2777; /* Pink 600 */
        --color-accent-hover: #be185d;
        --color-text-header: #831843; /* Pink 900 */
        --color-text-primary: #000000; /* Requested Black Text */
        --color-text-secondary: #4a044e;
        --color-border: #f472b6;
        background: #fdf2f8;
      }
      .theme-candy::before {
        content: '🍬 🍭 🧁';
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        font-size: 30px;
        animation: floatCandy 25s linear infinite;
        pointer-events: none;
        z-index: 0;
        opacity: 0.15;
        word-spacing: 20vw;
        line-height: 30vh;
      }
      @keyframes floatCandy {
        from { transform: translateY(-100px); }
        to { transform: translateY(100vh); }
      }

      /* 4. CHRISTMAS */
      .theme-christmas {
        --color-bg-primary: #022c22; /* Dark green */
        --color-bg-secondary: #064e3b;
        --color-sidebar: #065f46;
        --color-card: #064e3b;
        --color-accent: #dc2626; /* Red 600 */
        --color-accent-hover: #b91c1c;
        --color-text-header: #fee2e2;
        --color-text-primary: #fca5a5; /* Light red */
        --color-text-secondary: #99f6e4;
        --color-border: #047857;
        background: #022c22;
      }
      .theme-christmas::before {
        content: '🎄 🎁 ❄️';
        position: fixed;
        font-size: 24px;
        width: 100%; height: 100%;
        animation: snow 10s linear infinite;
        pointer-events: none;
        opacity: 0.2;
        word-spacing: 15vw;
        line-height: 20vh;
        z-index: 0;
      }
      @keyframes snow {
        0% { transform: translateY(-50px); }
        100% { transform: translateY(100vh); }
      }

      /* 5. HARRY POTTER */
      .theme-harry-potter {
        --color-bg-primary: #1c1917; /* Stone dark */
        --color-bg-secondary: #292524;
        --color-sidebar: #0c0a09;
        --color-card: #292524;
        --color-accent: #d97706; /* Amber/Gold */
        --color-accent-hover: #b45309;
        --color-text-header: #fbbf24;
        --color-text-primary: #e7e5e4;
        --color-text-secondary: #a8a29e;
        --color-border: #78350f;
        background-image: radial-gradient(circle at 50% 50%, #1c1917 0%, #000000 100%);
      }
      /* Moving sidebar elements */
      .theme-harry-potter aside nav a {
        animation: magicFloat 3s ease-in-out infinite;
        display: flex;
      }
      .theme-harry-potter aside nav a:nth-child(odd) { animation-delay: 0.5s; }
      .theme-harry-potter aside nav a:nth-child(even) { animation-delay: 1s; }
      
      @keyframes magicFloat {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(5px); }
      }

      /* 6. PAPER */
      .theme-paper {
        --color-bg-primary: #f5f5f5;
        --color-bg-secondary: #ffffff;
        --color-sidebar: #e5e5e5;
        --color-card: #ffffff;
        --color-accent: #2563eb; /* Blue pen color */
        --color-accent-hover: #1d4ed8;
        --color-text-header: #000000;
        --color-text-primary: #000000;
        --color-text-secondary: #525252;
        --color-border: #a3a3a3;
        --font-family: "Courier New", Courier, monospace; /* Handwritten-ish type */
        
        /* Grid paper background */
        background-color: #fff;
        background-image: 
          linear-gradient(#e5e5e5 1px, transparent 1px), 
          linear-gradient(90deg, #e5e5e5 1px, transparent 1px);
        background-size: 20px 20px;
      }
      .theme-paper::after {
        content: '✏️ 📝';
        position: fixed;
        bottom: 20px; right: 20px;
        font-size: 40px;
        opacity: 0.5;
        pointer-events: none;
      }
      .theme-paper .bg-card {
        box-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        border: 1px solid #000;
      }

      /* 7. MILITARY */
      .theme-military {
        --color-bg-primary: #3f4d38; /* Olive drab */
        --color-bg-secondary: #4b5c42;
        --color-sidebar: #2e382a;
        --color-card: #4b5c42;
        --color-accent: #a3b18a; /* Sage */
        --color-accent-hover: #dad7cd;
        --color-text-header: #ffffff;
        --color-text-primary: #dad7cd;
        --color-text-secondary: #a3b18a;
        --color-border: #588157;
        
        /* Pixel Camo Approximation using gradients */
        background-color: #3f4d38;
        background-image: 
          linear-gradient(45deg, #2e382a 25%, transparent 25%, transparent 75%, #2e382a 75%, #2e382a), 
          linear-gradient(45deg, #2e382a 25%, transparent 25%, transparent 75%, #2e382a 75%, #2e382a);
        background-size: 20px 20px;
        background-position: 0 0, 10px 10px;
      }
      .theme-military::after {
        content: '🪖 🛡️';
        position: fixed;
        bottom: 10px; left: 10px;
        font-size: 50px;
        opacity: 0.2;
        pointer-events: none;
      }

      /* 8. MATRIX */
      .theme-matrix {
        --color-bg-primary: #000000;
        --color-bg-secondary: #022c02; /* Very dark green */
        --color-sidebar: #000000;
        --color-card: rgba(0, 50, 0, 0.8);
        --color-accent: #00ff00; /* Matrix Green */
        --color-accent-hover: #ccffcc;
        --color-text-header: #00ff00;
        --color-text-primary: #00dd00;
        --color-text-secondary: #008800;
        --color-border: #004400;
        font-family: "Courier New", Courier, monospace;
        background: #000;
      }
      .theme-matrix::before {
        content: " ";
        display: block;
        position: fixed;
        top: 0; left: 0; bottom: 0; right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
        z-index: 9999;
        background-size: 100% 2px, 3px 100%;
        pointer-events: none;
      }
      .theme-matrix * {
        text-shadow: 0 0 2px #00ff00;
      }

      /* 9. HALLOWEEN */
      .theme-halloween {
        --color-bg-primary: #271300; /* Dark orange/brown */
        --color-bg-secondary: #451a03;
        --color-sidebar: #000000;
        --color-card: rgba(0,0,0,0.7);
        --color-accent: #f97316; /* Orange 500 */
        --color-accent-hover: #ea580c;
        --color-text-header: #fdba74;
        --color-text-primary: #fed7aa;
        --color-text-secondary: #9a3412;
        --color-border: #c2410c;
        background: #271300;
      }
      .theme-halloween::before {
        content: '🎃 🕷️ 🕸️ 🧙‍♀️';
        position: fixed;
        width: 100%; height: 100%;
        font-size: 24px;
        animation: spookFloat 8s ease-in-out infinite alternate;
        pointer-events: none;
        opacity: 0.3;
        word-spacing: 10vw;
        line-height: 25vh;
        z-index: 0;
      }
      @keyframes spookFloat {
        0% { transform: translateY(0) translateX(0); }
        100% { transform: translateY(-20px) translateX(10px); }
      }

      /* 10. STRONG */
      .theme-strong {
        --color-bg-primary: #000000;
        --color-bg-secondary: #000000;
        --color-sidebar: #000000;
        --color-card: #000000;
        --color-accent: #ffffff;
        --color-accent-hover: #cccccc;
        --color-text-header: #ffffff;
        --color-text-primary: #ffffff;
        --color-text-secondary: #ffffff;
        --color-border: #ffffff;
        background: #000;
      }
      .theme-strong .bg-card, .theme-strong .bg-sidebar {
          border: 2px solid #fff;
      }

      body {
        font-family: var(--font-family);
      }
      
      .logo-image {
        background-color: var(--color-accent);
        -webkit-mask: url(assets/logo.svg) no-repeat center;
        mask: url(assets/logo.svg) no-repeat center;
        -webkit-mask-size: contain;
        mask-size: contain;
        filter: drop-shadow(0 0 2rem color-mix(in srgb, var(--color-accent) 25%, transparent));
      }
      
      @keyframes gradient-text-anim {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      .animate-gradient-text {
        background: linear-gradient(90deg, #ff00e5, #3b82f6, #facc15, #ff00e5);
        background-size: 200% 200%;
        color: transparent;
        -webkit-background-clip: text;
        background-clip: text;
        animation: gradient-text-anim 4s ease infinite;
      }
      
      @keyframes pulse-attention {
          0%, 100% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); transform: scale(1); }
          50% { box-shadow: 0 0 0 10px rgba(255, 0, 0, 0); transform: scale(1.02); }
      }
      .animate-pulse-attention {
          animation: pulse-attention 1.5s infinite;
      }
       @keyframes top-pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.1); }
        100% { transform: scale(1); }
      }
      .animate-top-pulse {
        animation: top-pulse 2s infinite ease-in-out;
      }
      
      #spotlight {
        position: fixed;
        width: 300px;
        height: 300px;
        background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0) 70%);
        border-radius: 50%;
        pointer-events: none;
        z-index: 9999;
        transform: translate(-50%, -50%);
        transition: top 0.05s linear, left 0.05s linear; 
      }
      .glass-ui-enabled .bg-card, .glass-ui-enabled .bg-sidebar {
          background-color: rgba(255, 255, 255, 0.05);
          backdrop-filter: blur(10px);
          border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .theme-dark.glass-ui-enabled .bg-card, .theme-dark.glass-ui-enabled .bg-sidebar {
          background-color: rgba(15, 23, 42, 0.4);
      }
      .is-deleting {
        transition: all 0.5s ease;
        transform: scale(0.9);
        opacity: 0;
      }

      /* Schedule Highlighting */
      .schedule-highlight-row-hover > td::after,
      .schedule-highlight-col-hover::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background-color: rgba(255, 255, 255, 0.1);
        pointer-events: none;
        z-index: 20;
      }
      .theme-white .schedule-highlight-row-hover > td::after,
      .theme-white .schedule-highlight-col-hover::after {
        background-color: rgba(0, 0, 0, 0.05);
      }
      .schedule-day-highlight-problem {
          background-color: rgba(239, 68, 68, 0.3);
      }
      .schedule-weekend-glow {
          background-color: var(--color-weekend-highlight-bg);
      }
    </style>
    <script>
      tailwind.config = {
        future: {
            hoverOnlyWhenSupported: true,
        },
        theme: {
          extend: {
            colors: {
              'primary': 'var(--color-bg-primary)',
              'secondary': 'var(--color-bg-secondary)',
              'sidebar': 'var(--color-sidebar)',
              'card': 'var(--color-card)',
              'accent': 'var(--color-accent)',
              'accent-hover': 'var(--color-accent-hover)',
              'header': 'var(--color-text-header)',
              'primary-text': 'var(--color-text-primary)',
              'secondary-text': 'var(--color-text-secondary)',
              'border-color': 'var(--color-border)',
              'day-off': 'var(--color-day-off-bg)',
              'weekend-highlight': 'var(--color-weekend-highlight-bg)',
            },
            keyframes: {
              fadeInOut: {
                '0%': { opacity: '0', transform: 'translate(-50%, 10px)' },
                '10%, 90%': { opacity: '1', transform: 'translate(-50%, 0)' },
                '100%': { opacity: '0', transform: 'translate(-50%, 10px)' },
              },
              load: {
                '0%': { width: '0%' },
                '100%': { width: '100%' },
              }
            },
            animation: {
              'fade-in-out': 'fadeInOut 3s ease-in-out forwards',
              'load-bar': 'load 3s ease-in-out forwards',
            }
          }
        }
      }
    </script>

  <body class="bg-primary">
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
    <div id="spotlight"></div>
    <script>
        const spotlight = document.getElementById('spotlight');
        if (spotlight) {
            let mouseX = 0, mouseY = 0;
            let spotlightX = 0, spotlightY = 0;
            const speed = 0.1;

            document.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            function animate() {
                if (document.body.classList.contains('theme-spotlight')) {
                    const dx = mouseX - spotlightX;
                    const dy = mouseY - spotlightY;
                    spotlightX += dx * speed;
                    spotlightY += dy * speed;
                    spotlight.style.left = spotlightX + 'px';
                    spotlight.style.top = spotlightY + 'px';
                }
                requestAnimationFrame(animate);
            }
            animate();
        }
    </script>
  </body>
