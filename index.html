<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Система Обліку Нарядів</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --base-font-size: 13px;
        --user-text-primary-override: unset;
        
        /* Default transition settings */
        --transition-speed: 0.3s;
      }
      
      html {
        font-size: var(--base-font-size);
      }

      body {
        font-family: var(--font-family);
        transition: background-color 0.5s ease, color 0.3s ease;
        background-color: var(--color-bg-primary);
        color: var(--color-text-primary);
        min-height: 100vh;
        overflow-x: hidden; /* Prevent horizontal scroll from effects */
      }

      /* =========================================
         BASE THEME VARIABLES (Fallback/Dark)
         ========================================= */
      :root, .theme-dark {
        --color-bg-primary: #0f172a;
        --color-bg-secondary: #1e293b;
        --color-sidebar: rgba(15, 23, 42, 0.95);
        --color-card: rgba(30, 41, 59, 0.7);
        --color-accent: #6366f1; /* Indigo */
        --color-accent-hover: #818cf8;
        --color-text-header: #f8fafc;
        --color-text-primary: var(--user-text-primary-override, #cbd5e1);
        --color-text-secondary: #94a3b8;
        --color-border: #334155;
        --color-weekend-highlight-bg: #2d3748;
        --color-day-off-bg: #1e293b;
        
        --glass-border: 1px solid rgba(255, 255, 255, 0.05);
        --glass-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        --glass-backdrop: blur(10px);

        /* Duty Status Colors */
        --color-duty-onduty-bg: #e0e0e0; --color-duty-onduty-text: #000000;
        --color-duty-sick-bg: #facc15; --color-duty-sick-text: #1f2937;
        --color-duty-trip-bg: #3b82f6; --color-duty-trip-text: #ffffff;
        --color-duty-hospital-bg: #ef4444; --color-duty-hospital-text: #ffffff;
        --color-duty-leave-bg: #a855f7; --color-duty-leave-text: #ffffff;
        --color-duty-other-bg: #64748b; --color-duty-other-text: #ffffff;
      }

      .theme-white {
        --color-bg-primary: #f3f4f6;
        --color-bg-secondary: #ffffff;
        --color-sidebar: #ffffff;
        --color-card: #ffffff;
        --color-accent: #0ea5e9;
        --color-accent-hover: #0284c7;
        --color-text-header: #000000;
        /* Forced Black Text for Visibility */
        --color-text-primary: #000000 !important; 
        --color-text-secondary: #333333;
        --color-border: #d1d5db;
        --color-weekend-highlight-bg: #e5e7eb;
        --color-day-off-bg: #f3f4f6;
        
        --color-duty-onduty-bg: #111827; --color-duty-onduty-text: #ffffff;
        --color-duty-sick-bg: #fef08a; --color-duty-sick-text: #000000;
        --color-duty-trip-bg: #bfdbfe; --color-duty-trip-text: #000000;
        --color-duty-hospital-bg: #fecaca; --color-duty-hospital-text: #000000;
        --color-duty-leave-bg: #e9d5ff; --color-duty-leave-text: #000000;
        --color-duty-other-bg: #e2e8f0; --color-duty-other-text: #000000;
      }

      /* =========================================
         THEME: OCEAN (Deep, Dynamic, Bubbles)
         ========================================= */
      .theme-ocean {
        --color-bg-primary: #001e3c;
        --color-bg-secondary: rgba(10, 25, 41, 0.7);
        --color-sidebar: rgba(2, 16, 37, 0.9);
        --color-card: rgba(19, 47, 76, 0.8);
        --color-accent: #00bcd4; /* Cyan */
        --color-accent-hover: #26c6da;
        --color-text-header: #e0f7fa;
        --color-text-primary: #b2ebf2;
        --color-text-secondary: #4dd0e1;
        --color-border: #004d61;
        --color-weekend-highlight-bg: rgba(0, 188, 212, 0.15);
        
        background: radial-gradient(circle at bottom center, #006064 0%, #001e3c 80%);
        background-attachment: fixed;
      }
      .theme-ocean .bg-card, .theme-ocean .bg-sidebar {
        backdrop-filter: blur(8px);
        border: 1px solid rgba(0, 188, 212, 0.3);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 188, 212, 0.1);
      }

      /* =========================================
         THEME: WOOD (Forest, Warm, Fireflies)
         ========================================= */
      .theme-wood {
        --color-bg-primary: #261a12;
        --color-bg-secondary: #3e2723;
        --color-sidebar: #1b120d;
        --color-card: rgba(62, 39, 35, 0.9);
        --color-accent: #7cb342; /* Light Green */
        --color-accent-hover: #8bc34a;
        --color-text-header: #dcedc8;
        --color-text-primary: #efebe9;
        --color-text-secondary: #d7ccc8;
        --color-border: #5d4037;
        --color-weekend-highlight-bg: rgba(124, 179, 66, 0.15);
        
        background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 20.5V18H0v-2h20v-2H0v-2h20v-2H0V8h20V6H0V4h20V2H0V0h22v20h2V0h2v20h2V0h2v20h2V0h2v20h2V0h2v20h2v2H0z' fill='%233e2723' fill-opacity='0.2' fill-rule='evenodd'/%3E%3C/svg%3E");
        background-color: #261a12;
      }
      .theme-wood .bg-card, .theme-wood .bg-sidebar {
        border: 2px solid #5d4037;
        box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
      }

      /* =========================================
         THEME: CANDY (Vibrant, Pop, Sweet)
         ========================================= */
      .theme-candy {
        --color-bg-primary: #fff0f5; /* Lavender Blush */
        --color-bg-secondary: #ffffff;
        --color-sidebar: #f8bbd0;
        --color-card: rgba(255, 255, 255, 0.9);
        --color-accent: #ff4081; /* Pink */
        --color-accent-hover: #f50057;
        --color-text-header: #880e4f;
        /* Forced Black Text */
        --color-text-primary: #000000 !important;
        --color-text-secondary: #880e4f;
        --color-border: #f48fb1;
        --color-weekend-highlight-bg: #fce4ec;
        
        background: linear-gradient(45deg, #fce4ec 25%, #f8bbd0 25%, #f8bbd0 50%, #fce4ec 50%, #fce4ec 75%, #f8bbd0 75%, #f8bbd0 100%);
        background-size: 40px 40px;
        animation: candyScroll 60s linear infinite;
      }
      @keyframes candyScroll {
        0% { background-position: 0 0; }
        100% { background-position: 100px 100px; }
      }
      .theme-candy .bg-card, .theme-candy .bg-sidebar {
        border-radius: 20px;
        border: 3px solid #ff4081;
        box-shadow: 5px 5px 0px #f48fb1;
      }
      .theme-candy button {
        border-radius: 9999px; /* Pill buttons */
        font-weight: bold;
      }

      /* =========================================
         THEME: MATRIX (Digital, Glitch, Code)
         ========================================= */
      .theme-matrix {
        --color-bg-primary: #000000;
        --color-bg-secondary: #0a0a0a;
        --color-sidebar: #000000;
        --color-card: rgba(0, 20, 0, 0.95);
        --color-accent: #00ff41; /* Matrix Green */
        --color-accent-hover: #00cc33;
        --color-text-header: #00ff41;
        --color-text-primary: #00dd00;
        --color-text-secondary: #008f11;
        --color-border: #003b00;
        --color-weekend-highlight-bg: rgba(0, 255, 65, 0.1);
        --font-family: "Courier New", Courier, monospace;
        
        background-color: #000;
      }
      /* CRT Scanline Effect */
      .theme-matrix::after {
        content: " ";
        display: block;
        position: fixed;
        top: 0; left: 0; bottom: 0; right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
        z-index: 999;
        background-size: 100% 2px, 3px 100%;
        pointer-events: none;
      }
      .theme-matrix .bg-card, .theme-matrix .bg-sidebar {
        border: 1px solid #00ff41;
        box-shadow: 0 0 10px rgba(0, 255, 65, 0.2);
      }
      .theme-matrix * {
        text-shadow: 0 0 2px rgba(0, 255, 65, 0.5);
      }

      /* =========================================
         THEME: MILITARY (Tactical, Camo, Stencil)
         ========================================= */
      .theme-military {
        --color-bg-primary: #4b5320; /* Army Green */
        --color-bg-secondary: #3b3f2a;
        --color-sidebar: #282b1d;
        --color-card: rgba(59, 63, 42, 0.95);
        --color-accent: #8f9e6d; /* Sage */
        --color-accent-hover: #aeb585;
        --color-text-header: #e8e8d6;
        --color-text-primary: #d3d6c8;
        --color-text-secondary: #8c917b;
        --color-border: #5e6644;
        --color-weekend-highlight-bg: rgba(143, 158, 109, 0.2);
        
        background-color: #4b5320;
        background-image: 
            radial-gradient(circle at 20% 20%, rgba(0,0,0,0.4) 10%, transparent 10%),
            radial-gradient(circle at 80% 80%, rgba(0,0,0,0.4) 10%, transparent 10%),
            radial-gradient(circle at 50% 50%, rgba(0,0,0,0.2) 20%, transparent 20%);
        background-size: 200px 200px;
    }
      .theme-military .bg-card {
        border: 2px solid #5e6644;
        position: relative;
      }
      /* Tactical Corners */
      .theme-military .bg-card::before {
        content: '';
        position: absolute; top: -2px; left: -2px; width: 10px; height: 10px;
        border-top: 2px solid #8f9e6d; border-left: 2px solid #8f9e6d;
        z-index: 10;
      }
      .theme-military .bg-card::after {
        content: '';
        position: absolute; bottom: -2px; right: -2px; width: 10px; height: 10px;
        border-bottom: 2px solid #8f9e6d; border-right: 2px solid #8f9e6d;
        z-index: 10;
      }

      /* =========================================
         THEME: HALLOWEEN (Spooky, Fog, Glow)
         ========================================= */
      .theme-halloween {
        --color-bg-primary: #1a0505;
        --color-bg-secondary: #2d0a0a;
        --color-sidebar: #0f0202;
        --color-card: rgba(40, 10, 10, 0.9);
        --color-accent: #ff6600; /* Pumpkin */
        --color-accent-hover: #ff8533;
        --color-text-header: #ffa366;
        --color-text-primary: #ffd1b3;
        --color-text-secondary: #cc5200;
        --color-border: #661a00;
        --color-weekend-highlight-bg: rgba(255, 102, 0, 0.15);
        
        background: #1a0505;
      }
      .theme-halloween .bg-card, .theme-halloween .bg-sidebar {
        border: 1px solid #ff6600;
        box-shadow: 0 0 15px rgba(255, 102, 0, 0.2), inset 0 0 20px rgba(0,0,0,0.8);
      }
      
      /* =========================================
         THEME: CYBERPUNK (Neon, Grid, Future)
         ========================================= */
      .theme-cyberpunk {
        --color-bg-primary: #050510;
        --color-bg-secondary: #0d0d25;
        --color-sidebar: rgba(5, 5, 16, 0.95);
        --color-card: rgba(20, 20, 40, 0.85);
        --color-accent: #ff00ff; /* Magenta */
        --color-accent-hover: #d000d0;
        --color-text-header: #00ffff; /* Cyan */
        --color-text-primary: #e0e0ff;
        --color-text-secondary: #ff00ff;
        --color-border: #3333aa;
        --color-weekend-highlight-bg: rgba(255, 0, 255, 0.15);
        
        background: 
            linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
            linear-gradient(90deg, rgba(255, 0, 255, 0.06), rgba(0, 255, 255, 0.02), rgba(0, 0, 255, 0.06)),
            linear-gradient(to bottom, #050510, #1a0b2e);
        background-size: 100% 2px, 3px 100%, 100% 100%;
      }
      .theme-cyberpunk .bg-card, .theme-cyberpunk .bg-sidebar {
        border: 1px solid #00ffff;
        box-shadow: 0 0 10px #ff00ff, inset 0 0 5px #00ffff;
        clip-path: polygon(
            0 0, 
            100% 0, 
            100% calc(100% - 15px), 
            calc(100% - 15px) 100%, 
            0 100%
        ); /* Cut corner effect */
      }
      .theme-cyberpunk .text-header {
        text-shadow: 0 0 5px #00ffff;
      }

      /* =========================================
         THEME: PAPER (Drafting, Blueprints)
         ========================================= */
      .theme-paper {
        --color-bg-primary: #f0f0f0;
        --color-bg-secondary: #ffffff;
        --color-sidebar: #e8e8e8;
        --color-card: #ffffff;
        --color-accent: #2962ff; /* Blueprint Blue */
        --color-accent-hover: #0039cb;
        --color-text-header: #000000;
        /* Forced Black Text */
        --color-text-primary: #000000 !important;
        --color-text-secondary: #424242;
        --color-border: #bdbdbd;
        --color-weekend-highlight-bg: #e0e0e0;
        --font-family: 'Courier New', Courier, monospace;
        
        background-color: #f0f0f0;
        background-image: 
          linear-gradient(#cfd8dc 1px, transparent 1px), 
          linear-gradient(90deg, #cfd8dc 1px, transparent 1px);
        background-size: 20px 20px;
      }
      .theme-paper .bg-card {
        border: 2px solid #000;
        box-shadow: 6px 6px 0px rgba(0,0,0,0.1);
        transform: rotate(-0.5deg);
      }
      .theme-paper .bg-sidebar {
        border-right: 2px solid #000;
      }

      /* =========================================
         THEME: CHRISTMAS (Festive, Snow)
         ========================================= */
      .theme-christmas {
        --color-bg-primary: #0f3d2e; /* Dark Green */
        --color-bg-secondary: #1b5e47;
        --color-sidebar: #0a291f;
        --color-card: rgba(27, 94, 71, 0.9);
        --color-accent: #d32f2f; /* Red */
        --color-accent-hover: #b71c1c;
        --color-text-header: #fff;
        --color-text-primary: #e0f2f1;
        --color-text-secondary: #a7ffeb;
        --color-border: #2e7d32;
        --color-weekend-highlight-bg: rgba(255, 255, 255, 0.1);
        
        background: radial-gradient(circle, #1b5e47 0%, #0f3d2e 100%);
      }
      .theme-christmas .bg-card, .theme-christmas .bg-sidebar {
        border: 2px solid #ffcdd2; /* Light Red border */
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
      }

      /* =========================================
         THEME: MAGIC (Harry Potter, Parchment)
         ========================================= */
      .theme-harry-potter {
        --color-bg-primary: #2c241b;
        --color-bg-secondary: #3e3226;
        --color-sidebar: #1a1510;
        --color-card: rgba(62, 50, 38, 0.95);
        --color-accent: #ffb300; /* Gold */
        --color-accent-hover: #ffca28;
        --color-text-header: #ffecb3;
        --color-text-primary: #d7ccc8;
        --color-text-secondary: #8d6e63;
        --color-border: #5d4037;
        --color-weekend-highlight-bg: rgba(255, 179, 0, 0.15);
        font-family: 'Garamond', serif;
        
        background-color: #2c241b;
        background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffb300' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      }
      .theme-harry-potter .bg-card {
        border: 1px solid #ffb300;
        box-shadow: 0 0 20px rgba(255, 179, 0, 0.1);
      }

      /* =========================================
         THEME: STRONG (High Contrast B&W)
         ========================================= */
      .theme-strong {
        --color-bg-primary: #000000;
        --color-bg-secondary: #111111;
        --color-sidebar: #000000;
        --color-card: #000000;
        --color-accent: #ffffff;
        --color-accent-hover: #cccccc;
        --color-text-header: #ffffff;
        --color-text-primary: #ffffff;
        --color-text-secondary: #aaaaaa;
        --color-border: #ffffff;
        --color-weekend-highlight-bg: #222222;
      }
      .theme-strong .bg-card, .theme-strong .bg-sidebar {
        border: 2px solid #ffffff;
      }

      /* =========================================
         COMMON UTILS
         ========================================= */
      .logo-image {
        background-color: var(--color-accent);
        -webkit-mask: url(assets/logo.svg) no-repeat center;
        mask: url(assets/logo.svg) no-repeat center;
        -webkit-mask-size: contain;
        mask-size: contain;
        filter: drop-shadow(0 0 2rem color-mix(in srgb, var(--color-accent) 25%, transparent));
      }
      
      .glass-ui-enabled .bg-card, .glass-ui-enabled .bg-sidebar {
          background-color: var(--color-card); /* Fallback uses var */
          backdrop-filter: blur(10px);
      }

      .animate-gradient-text {
        background: linear-gradient(90deg, #ff00e5, #3b82f6, #facc15, #ff00e5);
        background-size: 200% 200%;
        color: transparent;
        -webkit-background-clip: text;
        background-clip: text;
        animation: gradient-text-anim 4s ease infinite;
      }
      @keyframes gradient-text-anim {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      
      .animate-pulse-attention {
          animation: pulse-attention 1.5s infinite;
      }
      @keyframes pulse-attention {
          0%, 100% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); transform: scale(1); }
          50% { box-shadow: 0 0 0 10px rgba(255, 0, 0, 0); transform: scale(1.02); }
      }

      .schedule-highlight-row-hover > td::after,
      .schedule-highlight-col-hover::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background-color: rgba(255, 255, 255, 0.1);
        pointer-events: none;
        z-index: 20;
      }
      .theme-white .schedule-highlight-row-hover > td::after,
      .theme-white .schedule-highlight-col-hover::after {
        background-color: rgba(0, 0, 0, 0.05);
      }
      .schedule-day-highlight-problem {
          background-color: rgba(239, 68, 68, 0.3);
      }
      .schedule-weekend-glow {
          background-color: var(--color-weekend-highlight-bg);
      }
      
      /* Schedule Fixed Width */
      .schedule-col-width {
          width: 35px;
          min-width: 35px;
          max-width: 35px;
      }
      
      /* New Animations for Secrets */
      @keyframes float-up {
        0% { transform: translateY(100vh) scale(0); opacity: 0; }
        50% { opacity: 0.7; }
        100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
      }
      
      @keyframes digital-rain {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100%); }
      }
      
      @keyframes firefly-move {
        0% { transform: translate(0, 0); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translate(var(--tx), var(--ty)); opacity: 0; }
      }

      /* =========================================
         SCROLLBARS
         ========================================= */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      
      ::-webkit-scrollbar-thumb {
        background-color: var(--color-border);
        border-radius: 99px;
      }
      
      ::-webkit-scrollbar-thumb:hover {
        background-color: var(--color-text-secondary);
      }
    </style>
    <script>
      tailwind.config = {
        future: {
            hoverOnlyWhenSupported: true,
        },
        theme: {
          extend: {
            colors: {
              'primary': 'var(--color-bg-primary)',
              'secondary': 'var(--color-bg-secondary)',
              'sidebar': 'var(--color-sidebar)',
              'card': 'var(--color-card)',
              'accent': 'var(--color-accent)',
              'accent-hover': 'var(--color-accent-hover)',
              'header': 'var(--color-text-header)',
              'primary-text': 'var(--color-text-primary)',
              'secondary-text': 'var(--color-text-secondary)',
              'border-color': 'var(--color-border)',
              'day-off': 'var(--color-day-off-bg)',
              'weekend-highlight': 'var(--color-weekend-highlight-bg)',
            },
            keyframes: {
              fadeInOut: {
                '0%': { opacity: '0', transform: 'translate(-50%, 10px)' },
                '10%, 90%': { opacity: '1', transform: 'translate(-50%, 0)' },
                '100%': { opacity: '0', transform: 'translate(-50%, 10px)' },
              },
            },
            animation: {
              'fade-in-out': 'fadeInOut 3s ease-in-out forwards',
            }
          }
        }
      }
    </script>
